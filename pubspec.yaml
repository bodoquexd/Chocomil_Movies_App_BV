name: chocomil_movies_app_bv
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  flutter_secure_storage: ^9.2.2
  go_router: ^17.2.3
  cupertino_icons: ^1.0.8
  google_fonts: ^8.1.0
  local_auth: ^3.0.1
  flutter_dotenv: ^6.0.1
  http: ^1.6.0
  provider: ^6.1.5

dev_dependencies:

  flutter_native_splash: ^2.4.1
  flutter_launcher_icons: ^0.13.1

  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/images/
    - .env

flutter_native_splash:
  color: "#0xFF8B4513"
  image: assets/images/splash.png
  android: true
  ios: true
  android_12:
    color: "#0xFF8B4513"
    image: assets/images/splash.png

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/icon_app.png"
  adaptive_icon_foreground: "assets/images/icon_app.png"
  adaptive_icon_background: "#3A3D46"